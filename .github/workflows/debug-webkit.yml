name: Debug WebKit

on:
  push:
    branches: [debug/webkit-hang]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install webkit and its system libraries
        run: npx playwright install --with-deps webkit
      - name: Serve the site and wait until it answers
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then
              echo "Server is answering on 127.0.0.1:8123"
              exit 0
            fi
            sleep 1
          done
          echo "The local server did not start" >&2
          exit 1
      - name: Contextual help at 320px (action log)
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          npx playwright test test/browser/help-alignment.spec.mjs --browser=webkit \
            --reporter=list --workers=1 --timeout=15000 \
            --grep "contextual help alignment at 320px in light" 2>&1 | tail -300
      - name: Guidance motion at 320px (action log)
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          npx playwright test test/browser/motion.spec.mjs --browser=webkit \
            --reporter=list --workers=1 --timeout=15000 \
            --grep "guidance motion at 320px with reduce" 2>&1 | tail -300
      - name: Header Help Centre at 320px (action log)
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          npx playwright test test/browser/independent-qa.spec.mjs --browser=webkit \
            --reporter=list --workers=1 \
            --grep "all six routes at 320px in light" 2>&1 | tail -400
      - name: Control - guidance at 320px tap (known green)
        continue-on-error: true
        env:
          DEBUG: pw:api
        run: |
          npx playwright test test/browser/guidance.spec.mjs --browser=webkit \
            --reporter=list --workers=1 --timeout=20000 \
            --grep "quick explanations fit a short touch viewport" 2>&1 | tail -120
