name: Focused WebKit same-runner anchoring control
on:
  push:
    branches: [codex/task-03-2-webkit-onboarding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Preserve source, record environment and serve unchanged application
        run: |
          mkdir -p qa/task032
          cp css/experience.css qa/task032/original-experience.css
          cat /etc/os-release > qa/task032/os.txt
          printenv ImageOS ImageVersion > qa/task032/runner-image.txt
          sha256sum css/experience.css > qa/task032/source-css.txt
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Original application, worker allowed, original strict interaction
        continue-on-error: true # Preserve a failing diagnostic control; not a release gate.
        run: RATE_TRACE=1 npx playwright test test/browser/onboarding.spec.mjs --browser=webkit --grep 'setup from catalogue|setup from studio|draft survives reload' --repeat-each=10 --workers=2 --reporter=line --output=qa/task032/original > qa/task032/original.log 2>&1
      - name: Test only a scoped anchoring override in this disposable runner
        run: |
          printf '\n.onboarding-body { overflow-anchor: none; }\n' >> css/experience.css
      - name: Same runner and strict interaction, anchoring disabled
        continue-on-error: true
        run: RATE_TRACE=1 npx playwright test test/browser/onboarding.spec.mjs --browser=webkit --grep 'setup from catalogue|setup from studio|draft survives reload' --repeat-each=10 --workers=2 --reporter=line --output=qa/task032/anchor-none > qa/task032/anchor-none.log 2>&1
      - name: Restore the original source for the reversal control
        run: cp qa/task032/original-experience.css css/experience.css
      - name: Original application again on the same runner
        continue-on-error: true
        run: RATE_TRACE=1 npx playwright test test/browser/onboarding.spec.mjs --browser=webkit --grep 'setup from catalogue|setup from studio|draft survives reload' --repeat-each=5 --workers=2 --reporter=line --output=qa/task032/reversal > qa/task032/reversal.log 2>&1
      - name: Retain raw controls without deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task032-same-runner-controls
          path: qa/task032
          retention-days: 14
