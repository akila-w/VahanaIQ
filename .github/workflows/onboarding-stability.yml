name: Focused onboarding stability investigation
on:
  push:
    branches: [codex/task-03-2-webkit-onboarding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        interaction: [wheel, dom, ready]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Record environment and serve unchanged application
        run: |
          mkdir -p qa/task032
          cat /etc/os-release > qa/task032/os.txt
          printenv ImageOS ImageVersion > qa/task032/runner-image.txt
          npx playwright --version > qa/task032/playwright.txt
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Long-lived browser and real saved-state journeys
        env:
          ONBOARDING_INTERACTION: ${{ matrix.interaction }}
          ONBOARDING_OBSERVE: '1'
          ONBOARDING_CASES: '12'
        run: npx playwright test test/browser/onboarding-stability.spec.mjs --browser=webkit --workers=2 --reporter=line --output=qa/task032/warm > qa/task032/warm.log 2>&1
      - name: Retain every diagnostic outcome without deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task032-onboarding-diagnosis-${{ matrix.interaction }}
          path: qa/task032
          retention-days: 14
