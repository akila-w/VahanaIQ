name: Focused onboarding geometry isolation
on:
  push:
    branches: [codex/task-03-2-webkit-onboarding]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - interaction: explicit
            css: original
          - interaction: explicit
            css: anchor-none
          - interaction: explicit
            css: integer
          - interaction: focus
            css: original
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Record environment, stage opt-in diagnostics and serve unchanged application
        run: |
          mkdir -p qa/task032
          cat /etc/os-release > qa/task032/os.txt
          printenv ImageOS ImageVersion > qa/task032/runner-image.txt
          sha256sum css/experience.css > qa/task032/source-css.txt
          cp test/diagnostics/onboarding-stability.mjs qa/task032/onboarding-stability.spec.mjs
          cp test/diagnostics/onboarding-observer.mjs qa/task032/onboarding-observer.mjs
          cp test/diagnostics/playwright.config.mjs qa/task032/playwright.config.mjs
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Controlled two-worker geometry comparison
        env:
          ONBOARDING_INTERACTION: ${{ matrix.interaction }}
          ONBOARDING_CSS: ${{ matrix.css }}
          ONBOARDING_PARALLEL: '1'
          ONBOARDING_OBSERVE: '1'
          ONBOARDING_CASES: '12'
        run: npx playwright test --config=qa/task032/playwright.config.mjs --browser=webkit --workers=2 --reporter=line --output=qa/task032/isolation > qa/task032/isolation.log 2>&1
      - name: Retain all control outcomes without deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task032-isolate-${{ matrix.interaction }}-${{ matrix.css }}
          path: qa/task032
          retention-days: 14
