name: Verify VahanaIQ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication:
    name: publication (GitHub Pages / Jekyll)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare tracked source and future-report regression fixtures
        id: fixture
        run: node scripts/verify-publication.mjs prepare
      - name: Build with the production Pages action (github-pages 232 / Jekyll 3.10)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ${{ steps.fixture.outputs.source }}
          destination: ${{ steps.fixture.outputs.destination }}
      - name: Verify generated publishing directory and smoke negative controls
        run: node scripts/verify-publication.mjs check "${{ steps.fixture.outputs.work }}"
      - name: Retain publication evidence without deploying
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-verification
          path: |
            ${{ steps.fixture.outputs.work }}/fixture.json
            ${{ steps.fixture.outputs.work }}/verification.json
            ${{ steps.fixture.outputs.work }}/*.log
          retention-days: 14
  verify:
    needs: publication
    # Required checks must FAIL, rather than be skipped, when publication fails.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful publication verification
        env:
          PUBLICATION_RESULT: ${{ needs.publication.result }}
        run: test "$PUBLICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Fetch PR base for publication approval verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
      - name: Verify price publication approvals against protected base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify-catalogue-publication-pr.mjs
      - name: Install dev dependencies (esbuild builds css/style.min.css)
        run: npm ci
      - name: Run regression suites without external services
        run: |
          node test/verify.mjs
          node test/verify-graphics.test.mjs
          node test/qa-regressions.test.mjs
          node test/catalogue.test.mjs
          node test/client-ip.test.mjs
          node test/proxy-search.test.mjs
          node test/proxy-price-mode.test.mjs
          node test/security.test.mjs
          node test/csp.test.mjs
          node test/module-versions.test.mjs
          node test/refresh-prices.test.mjs
          node test/tokens.test.mjs
          node test/style-min.test.mjs
          node test/calculator.test.mjs
          node test/account.test.mjs
          node test/account-session.test.mjs
          node test/copy-privacy.test.mjs
          node test/catalogue-data.test.mjs
          node test/price-evidence.test.mjs
          node test/catalogue-price-parity.test.mjs
          node test/catalogue-price-approval.test.mjs
          node test/catalogue-price-research.test.mjs
          node test/catalogue-publication.test.mjs
          node test/catalogue-publication-pr-guard.test.mjs
          node test/catalogue-calculator-imagery.test.mjs
          node test/catalogue-studio.test.mjs
          node test/planner.test.mjs
          node test/print.test.mjs
          node test/scan-prices.test.mjs
          node test/savings-bulk.test.mjs
          node test/e2e-journeys.test.mjs
          node test/guidance.test.mjs
          node test/onboarding.test.mjs
          node --test test/deploy-readiness.test.mjs
      - name: Check the repository keeps only published assets
        run: node scripts/prune-thumbnails.mjs --check

  # One job per engine, so each reports its own status. Firefox runs here because the
  # Playwright Firefox build does not start on the maintainer's macOS 27 machine.
  browser:
    needs: publication
    if: ${{ always() }}
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # WebKit under WPE runs the same specs several times slower than Chromium, so it needs
    # more headroom than the other engines to finish a green run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - name: Require successful publication verification
        env:
          PUBLICATION_RESULT: ${{ needs.publication.result }}
        run: test "$PUBLICATION_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install ${{ matrix.browser }} and its system libraries
        timeout-minutes: 20
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve the site and wait until it answers
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then
              echo "Server is answering on 127.0.0.1:8123"
              exit 0
            fi
            sleep 1
          done
          echo "The local server did not start" >&2
          exit 1
      - name: Repeat WebKit cache activation ordering
        if: matrix.browser == 'webkit'
        run: npx playwright test test/browser/offline.spec.mjs --browser=webkit --grep 'two complete cache revisions' --repeat-each=5 --workers=1 --trace=retain-on-failure --reporter=line
      - name: Run browser specs in ${{ matrix.browser }}
        run: npx playwright test test/browser/fonts.spec.mjs test/browser/csp.spec.mjs test/browser/ui-responsive.spec.mjs test/browser/guidance.spec.mjs test/browser/independent-qa.spec.mjs test/browser/help-alignment.spec.mjs test/browser/motion.spec.mjs test/browser/onboarding.spec.mjs test/browser/offline.spec.mjs test/browser/offline-diagnostic.spec.mjs --browser=${{ matrix.browser }} --workers=2 --reporter=list,github
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results
          retention-days: 7
