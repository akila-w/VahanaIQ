name: Verify VahanaIQ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dev dependencies (esbuild builds css/style.min.css)
        run: npm ci
      - name: Run regression suites without external services
        run: |
          node test/verify.mjs
          node test/verify-graphics.test.mjs
          node test/qa-regressions.test.mjs
          node test/catalogue.test.mjs
          node test/client-ip.test.mjs
          node test/proxy-search.test.mjs
          node test/proxy-price-mode.test.mjs
          node test/security.test.mjs
          node test/csp.test.mjs
          node test/module-versions.test.mjs
          node test/refresh-prices.test.mjs
          node test/tokens.test.mjs
          node test/style-min.test.mjs
          node test/calculator.test.mjs
          node test/account.test.mjs
          node test/account-session.test.mjs
          node test/copy-privacy.test.mjs
          node test/catalogue-data.test.mjs
          node test/catalogue-calculator-imagery.test.mjs
          node test/catalogue-studio.test.mjs
          node test/planner.test.mjs
          node test/print.test.mjs
          node test/scan-prices.test.mjs
          node test/savings-bulk.test.mjs
          node test/e2e-journeys.test.mjs
          node test/guidance.test.mjs
          node test/onboarding.test.mjs
      - name: Check the repository keeps only published assets
        run: node scripts/prune-thumbnails.mjs --check

  # One job per engine, so each reports its own status. Firefox runs here because the
  # Playwright Firefox build does not start on the maintainer's macOS 27 machine.
  browser:
    name: browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # WebKit under WPE runs the same specs several times slower than Chromium, so it needs
    # more headroom than the other engines to finish a green run.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install ${{ matrix.browser }} and its system libraries
        timeout-minutes: 20
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Serve the site and wait until it answers
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then
              echo "Server is answering on 127.0.0.1:8123"
              exit 0
            fi
            sleep 1
          done
          echo "The local server did not start" >&2
          exit 1
      - name: Run browser specs in ${{ matrix.browser }}
        run: npx playwright test test/browser/csp.spec.mjs test/browser/ui-responsive.spec.mjs test/browser/guidance.spec.mjs test/browser/independent-qa.spec.mjs test/browser/help-alignment.spec.mjs test/browser/motion.spec.mjs test/browser/onboarding.spec.mjs --browser=${{ matrix.browser }} --workers=2 --reporter=list,github
