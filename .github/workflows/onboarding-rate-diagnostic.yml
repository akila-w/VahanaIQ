name: Diagnose onboarding rate
on:
  pull_request:
    paths:
      - test/browser/onboarding-rate-diagnostic.spec.mjs
      - .github/workflows/onboarding-rate-diagnostic.yml
permissions:
  contents: read
jobs:
  firefox-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Serve current and main baseline source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/vahanaiq-baseline
          git archive "$BASE_SHA" | tar -x -C /tmp/vahanaiq-baseline
          python3 -m http.server 8123 --bind 127.0.0.1 &
          python3 -m http.server 8124 --bind 127.0.0.1 --directory /tmp/vahanaiq-baseline &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html && curl -fsS -o /dev/null http://127.0.0.1:8124/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Repeat focused scenario on current code
        continue-on-error: true
        run: DIAG_LABEL=head npx playwright test test/browser/onboarding-rate-diagnostic.spec.mjs --browser=firefox --repeat-each=20 --workers=1 --reporter=line --output=rate-head
      - name: Repeat focused scenario on main baseline
        continue-on-error: true
        run: DIAG_LABEL=main BASE_URL=http://127.0.0.1:8124 DIAG_SOURCE_ROOT=/tmp/vahanaiq-baseline npx playwright test test/browser/onboarding-rate-diagnostic.spec.mjs --browser=firefox --repeat-each=20 --workers=1 --reporter=line --output=rate-main
      - name: Exercise deferred focus while editing on current code
        continue-on-error: true
        run: DIAG_LABEL=head-controlled DIAG_FORCE_FOCUS=1 npx playwright test test/browser/onboarding-rate-diagnostic.spec.mjs --browser=firefox --workers=1 --reporter=line --output=rate-head-controlled
      - name: Exercise deferred focus while editing on main baseline
        continue-on-error: true
        run: DIAG_LABEL=main-controlled DIAG_FORCE_FOCUS=1 BASE_URL=http://127.0.0.1:8124 DIAG_SOURCE_ROOT=/tmp/vahanaiq-baseline npx playwright test test/browser/onboarding-rate-diagnostic.spec.mjs --browser=firefox --workers=1 --reporter=line --output=rate-main-controlled
      - name: Retain diagnostic traces, screenshots and state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: onboarding-rate-diagnostic
          path: |
            rate-head
            rate-main
            rate-head-controlled
            rate-main-controlled
          retention-days: 7
