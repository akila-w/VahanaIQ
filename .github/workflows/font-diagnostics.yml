name: Focused font verification
on:
  push:
    branches: [codex/task-03-1-font-metrics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fonts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Capture font environment and serve application
        run: |
          mkdir -p qa/task031-verification
          cat /etc/os-release > qa/task031-verification/os.txt
          fc-list > qa/task031-verification/fonts.txt
          dpkg-query -W 'fonts-*' > qa/task031-verification/font-packages.txt
          printenv ImageOS ImageVersion > qa/task031-verification/runner-image.txt
          python3 -m http.server 8123 --bind 127.0.0.1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8123/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Repeat focused font checks
        env:
          FONT_BROWSER: ${{ matrix.browser }}
        run: |
          repeats=3
          if [ "$FONT_BROWSER" = firefox ]; then repeats=10; fi
          npx playwright test test/browser/fonts.spec.mjs --browser="$FONT_BROWSER" --workers=1 --repeat-each="$repeats" --reporter=line > qa/task031-verification/result.log 2>&1
      - name: Keep focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task031-font-verification-${{ matrix.browser }}
          path: |
            qa/task031-verification
            test-results
          retention-days: 14
