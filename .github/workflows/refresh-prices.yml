# Monthly refresh of the 12 built-in catalogue prices.
# Asks the search proxy for each vehicle's brand-new price, rewrites only the prices
# and catalogMeta.priceUpdated in js/catalog.js, and opens a pull request for review.
# It never commits to main. See "Monthly catalogue price refresh" in README.md.
name: Refresh catalogue prices

on:
  # Monthly schedule paused (20/10/2026): no free Gemini model on this project can use
  # Google Search any more, so a scheduled run would only fail. Manual runs still work.
  # To resume, restore:
  # schedule:
  #   - cron: "30 8 1 * *"  # 08:30 UTC (14:00 in Sri Lanka), after the free daily reset
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the diff and report without opening a pull request"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Ask the proxy for current prices
        env:
          # Optional repository variable; otherwise config.proxyUrl in js/config.js is used
          PROXY_URL: ${{ vars.PROXY_URL }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # The report goes on the run's summary page even when the refresh fails
          status=0
          node scripts/refresh-prices.mjs $DRY_RUN --report "$RUNNER_TEMP/pr-body.md" || status=$?
          if [ -f "$RUNNER_TEMP/pr-body.md" ]; then cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Run the verification suites
        run: |
          node test/verify.mjs
          node test/refresh-prices.test.mjs
          node test/proxy-price-mode.test.mjs

      - name: Open or update the pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n---\nOpened by the [Refresh catalogue prices](%s/%s/actions/runs/%s) workflow.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/open-price-pr.sh "$RUNNER_TEMP/pr-body.md"
