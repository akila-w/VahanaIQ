# Monthly refresh of priced catalogue variants.
# Reads the sites that publish brand-new prices (scripts/scan-prices.mjs), rewrites only the
# prices and source/month evidence in js/market-catalogue.js, and opens a pull request for
# review. It never commits to main. See "Monthly catalogue price refresh" in README.md.
name: Refresh catalogue prices

on:
  schedule:
    - cron: "30 8 1 * *"  # 08:30 UTC (14:00 in Sri Lanka) on the 1st of each month
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the diff and report without opening a pull request"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Scan the price sites and apply the changes
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # The reports go on the run's summary page even when a step fails
          status=0
          node scripts/scan-prices.mjs --out "$RUNNER_TEMP/scan" || status=$?
          if [ $status -eq 0 ]; then
            node scripts/refresh-prices.mjs $DRY_RUN --from-file "$RUNNER_TEMP/scan/prices.json" --report "$RUNNER_TEMP/pr-body.md" || status=$?
          fi
          if [ -f "$RUNNER_TEMP/scan/report.md" ]; then
            printf '\n' >> "$RUNNER_TEMP/pr-body.md"
            cat "$RUNNER_TEMP/scan/report.md" >> "$RUNNER_TEMP/pr-body.md"
          fi
          if [ -f "$RUNNER_TEMP/pr-body.md" ]; then cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Run the verification suites
        run: |
          node test/verify.mjs
          node test/catalogue.test.mjs
          node test/refresh-prices.test.mjs
          node test/scan-prices.test.mjs

      - name: Open or update the pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n---\nOpened by the [Refresh catalogue prices](%s/%s/actions/runs/%s) workflow.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/open-price-pr.sh "$RUNNER_TEMP/pr-body.md"
