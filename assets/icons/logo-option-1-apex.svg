<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="apex-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D5C52"/>
      <stop offset="100%" stop-color="#04433B"/>
    </linearGradient>
    <linearGradient id="apex-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="apex-spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="apex-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F766E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container badge (optional background for standalone/app icon) -->
  <rect width="120" height="120" rx="28" fill="#0F172A"/>

  <!-- Geometric V Left Wing (Solid Anchor) -->
  <path d="M26 34 L43 34 L57 82 L42 82 Z" fill="url(#apex-grad-left)"/>

  <!-- Geometric V Right Wing (Dynamic Accelerated Fin) -->
  <path d="M63 82 L77 82 L94 34 L78 34 L60 72 Z" fill="url(#apex-grad-right)" filter="url(#apex-glow)"/>

  <!-- Negative Space Road / Horizon Notch at base -->
  <path d="M50 82 L60 52 L70 82 Z" fill="#0F172A" opacity="0.9"/>

  <!-- IQ Precision Spark / Intelligence Core -->
  <circle cx="94" cy="24" r="6" fill="url(#apex-spark)"/>
</svg>
