<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Full-bleed opaque tile (no rx): Safari and the OS mask the corners, and an opaque
       perimeter stops Safari adding a white box in dark mode -->
  <rect width="64" height="64" fill="#0F172A"/>

  <!-- Apex monogram, drawn like the app icons and centred: the wings plus the spark span
       7.3–57 across and 10.4–53.3 down. Flat fills, no glow, so it stays sharp when small -->
  <path fill="#2DD4BF" d="M7.3 21.3 H18.7 L25.7 45.3 L23.7 53.3 H17.7 Z"/>
  <path fill="#5EEAD4" d="M41 21.3 H52.7 L41.3 53.3 H36 L32.7 45.3 Z"/>
  <circle fill="#A7F3D0" cx="52.7" cy="14.7" r="4.3"/>
</svg>
